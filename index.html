
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kindly — Small actions. Real impact.</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="#" class="logo">kindly<span>.</span></a>
    <p>Small actions. Real impact.</p>
  </header>

  <main class="hero">
    <span class="tag">UM PEQUENO GESTO MUDA MUITO</span>

    <h1>O bem começa com <span>uma atitude.</span></h1>

    <p class="description">
      Você não precisa mudar o mundo inteiro.
      Às vezes, basta tornar o dia de alguém melhor.
    </p>

    <button id="actionButton">
      Descobrir uma boa ação <span>→</span>
    </button>

    <div id="actionCard" class="action-card" hidden>
      <span class="card-label">SUA BOA AÇÃO DE HOJE</span>
      <p id="actionText"></p>
      <button id="newActionButton" class="secondary-button">
        Quero outra sugestão
      </button>
    </div>

    <p class="footer-note">Pequenos gestos. Grandes diferenças.</p>
  </main>

  <footer>
    Feito com carinho. Um gesto de cada vez. <span>♥</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
